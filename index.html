<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisores - Sierras Chicas</title>
    <style>
        :root {
            --bg-color: #070d19;
            --card-bg: #0f1d32;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #00a3e0;
            --am-bg: rgba(0, 163, 224, 0.18);
            --am-text: #38bdf8;
            --pm-bg: rgba(245, 158, 11, 0.18);
            --pm-text: #fbbf24;
            --guardia-bg: rgba(239, 68, 68, 0.18);
            --guardia-text: #f87171;
            --franco-bg: rgba(100, 116, 139, 0.18);
            --franco-text: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            background-color: var(--accent-blue);
            color: #fff;
            font-weight: 700;
            width: 40px;
            height: 40px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 2px 10px rgba(0, 163, 224, 0.35);
            cursor: pointer;
        }

        .app-title h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .app-title p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        /* Selector protegido por PIN */
        .date-navigator {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 11px;
            padding: 11px 15px;
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .date-navigator.unlocked {
            display: flex;
        }

        .nav-arrow {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 35px;
            height: 35px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .current-date-display {
            text-align: center;
        }

        .current-date-display .main-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .current-date-display .sub-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Cuadro unificado */
        .unified-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 13px;
            padding: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            overflow-x: auto;
        }

        .days-header-grid {
            display: grid;
            gap: 4px;
            padding-bottom: 9px;
            border-bottom: 1px solid var(--card-border);
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .days-header-grid .col-sup {
            text-align: left;
            padding-left: 4px;
        }

        .supervisor-row {
            display: grid;
            gap: 4px;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .supervisor-row:last-child {
            border-bottom: none;
        }

        .sup-info .sup-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sup-info .sup-area {
            font-size: 10px;
            color: var(--accent-blue);
            font-weight: 600;
            margin-top: 1px;
        }

        .sup-contact-icons {
            display: flex;
            gap: 9px;
            margin-top: 4px;
        }

        .contact-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            width: 31px;
            height: 31px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .contact-btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .contact-btn svg {
            width: 19px;
            height: 19px;
        }

        .shift-cell {
            text-align: center;
            padding: 7px 2px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        /* Estilos de turnos */
        .badge-am { background: var(--am-bg); color: var(--am-text); border: 1px solid rgba(56, 189, 248, 0.25); }
        .badge-pm { background: var(--pm-bg); color: var(--pm-text); border: 1px solid rgba(251, 191, 36, 0.25); }
        .badge-guardia { background: var(--guardia-bg); color: var(--guardia-text); border: 1px solid rgba(248, 113, 113, 0.25); font-size: 10px; }
        .badge-franco { background: var(--franco-bg); color: var(--franco-text); border: 1px solid rgba(148, 163, 184, 0.15); }
        .badge-empty { color: var(--text-muted); opacity: 0.35; }

        /* Referencias */
        .legend {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 9px;
            padding: 9px;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        /* Vista Planilla */
        .excel-view {
            display: none;
        }

        .excel-table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 11px;
            overflow-x: auto;
            max-height: 420px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
        }

        th, td {
            padding: 9px 7px;
            border-bottom: 1px solid var(--card-border);
            white-space: nowrap;
        }

        th {
            background: #132238;
            color: var(--text-main);
            position: sticky;
            top: 0;
            z-index: 2;
        }

        td:first-child, th:first-child {
            position: sticky;
            left: 0;
            background: #0f1d32;
            z-index: 1;
            text-align: left;
            padding-left: 12px;
        }

        footer {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <div class="logo-badge" onclick="solicitarPin()" title="Tocar para desbloquear modo semana">P</div>
                <div class="app-title">
                    <h1>Supervisores</h1>
                    <p>Sierras Chicas • Operaciones</p>
                </div>
            </div>
            <div class="nav-tabs">
                <button class="tab-btn active" id="btnTurnos" onclick="switchTab('turnos')">Turnos</button>
                <button class="tab-btn" id="btnExcel" onclick="switchTab('excel')">Planilla</button>
            </div>
        </header>

        <!-- SELECTOR DE SEMANAS (BLOQUEADO POR PIN) -->
        <div id="dateNavigator" class="date-navigator">
            <button class="nav-arrow" onclick="changeWeek(-1)">&#10094;</button>
            <div class="current-date-display">
                <div class="main-label" id="lblRangoFechas">Semana</div>
                <div class="sub-label" id="lblSubSemana">Modo Auditoría</div>
            </div>
            <button class="nav-arrow" onclick="changeWeek(1)">&#10095;</button>
        </div>

        <!-- CUADRO UNIFICADO -->
        <div class="unified-card">
            <div class="days-header-grid" id="headerGridDays">
                <!-- Dinámico -->
            </div>
            <div id="rowsSupervisorsContainer">
                <div style="text-align:center; padding: 22px; color:var(--text-muted);">Cargando turnos en vivo...</div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:var(--am-text)"></div>AM</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--pm-text)"></div>PM</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--guardia-text)"></div>AM/PM (G)</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--franco-text)"></div>Franco</div>
        </div>

        <!-- VISTA PLANILLA -->
        <div id="viewExcel" class="excel-view">
            <div class="excel-table-container">
                <table id="excelTable">
                    <tr><td>Cargando planilla...</td></tr>
                </table>
            </div>
        </div>

        <footer>Sierras Chicas • Panel Operativo</footer>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzteLGryKx4kSM6cisczuYjauFyZKHP8j1F6QP19mLnIJbl2BU7VKTXF2kGXPwrgwY/exec";

        const supervisorsList = [
            { key: "QUIROGA", name: "Quiroga Lucas", area: "Redes", phone: "5493515923910", email: "lquiroga@personal.com.ar" },
            { key: "MARELLI", name: "Marelli Pablo", area: "Redes", phone: "5493513570182", email: "pmarelli@personal.com.ar" },
            { key: "CERVELLERA", name: "Cervellera Diego", area: "Eventos", phone: "5493543601730", email: "dmcervellera@personal.com.ar" },
            { key: "SALDIVIA", name: "Saldivia Carlos", area: "Eventos", phone: "5493516146481", email: "cmsaldivia@personal.com.ar" }
        ];

        let rawSchedule = {};
        let availableDates = [];
        let baseDate = new Date();
        let isUnlocked = false; // Arranca bloqueado mostrando 1 solo día por defecto

        async function loadSheetData() {
            try {
                const response = await fetch(API_URL, { redirect: "follow" });
                const rows = await response.json();
                parseSheetRows(rows);
                
                if (availableDates.length > 0) {
                    let todayKey = formatDateKey(new Date());
                    let found = availableDates.find(d => d.dateStr === todayKey);
                    if (!found) {
                        baseDate = parseDateKey(availableDates[0].dateStr);
                    }
                }
                renderApp();
            } catch (error) {
                console.error("Error al procesar datos:", error);
                document.getElementById('rowsSupervisorsContainer').innerHTML = 
                    `<div style="text-align:center; padding:15px; color:#f87171; font-size:12px;">Error al procesar datos del Google Sheet.</div>`;
            }
        }

        function parseSheetRows(rows) {
            if (!rows || rows.length < 2) return;
            const headers = rows[0];
            availableDates = [];

            for (let c = 2; c < headers.length; c++) {
                let h = String(headers[c]).trim();
                if (h) {
                    let normalized = parseAnyDate(h);
                    if (normalized) {
                        availableDates.push({ colIndex: c, dateStr: normalized, label: h.split('T')[0] });
                    }
                }
            }

            let maxRows = Math.min(rows.length, 6);
            for (let r = 1; r < maxRows; r++) {
                let row = rows[r];
                if (!row || row.length < 2) continue;
                let supNameRaw = row[1] ? String(row[1]).trim().toUpperCase() : "";

                let supKey = "";
                if (supNameRaw.includes("QUIROGA")) supKey = "QUIROGA";
                else if (supNameRaw.includes("MARELLI")) supKey = "MARELLI";
                else if (supNameRaw.includes("CERVELLERA")) supKey = "CERVELLERA";
                else if (supNameRaw.includes("SALDIVIA")) supKey = "SALDIVIA";

                if (supKey) {
                    availableDates.forEach(item => {
                        let val = row[item.colIndex] !== undefined ? String(row[item.colIndex]).trim() : "";
                        if (!rawSchedule[item.dateStr]) {
                            rawSchedule[item.dateStr] = {};
                        }
                        rawSchedule[item.dateStr][supKey] = val;
                    });
                }
            }
        }

        function parseAnyDate(str) {
            str = str.trim();
            if (str.includes('T') || str.includes('Z')) {
                return str.split('T')[0];
            }
            if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(str)) {
                let parts = str.split(/[-/]/);
                return `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
            }
            let lower = str.toLowerCase();
            const months = { 'ene': '01', 'feb': '02', 'mar': '03', 'abr': '04', 'may': '05', 'jun': '06', 'jul': '07', 'ago': '08', 'sep': '09', 'oct': '10', 'nov': '11', 'dic': '12' };
            let parts = lower.split(/[-/]/);
            if (parts.length >= 2) {
                let day = parts[0].padStart(2, '0');
                let mKey = parts[1].substring(0, 3);
                let month = months[mKey];
                let year = parts[2] ? (parts[2].length === 2 ? '20' + parts[2] : parts[2]) : '2026';
                if (month) return `${year}-${month}-${day}`;
            }
            let d = new Date(str);
            if (!isNaN(d.getTime())) {
                return formatDateKey(d);
            }
            return null;
        }

        function parseDateKey(str) {
            let p = str.split('-');
            return new Date(p[0], p[1] - 1, p[2]);
        }

        function formatDateKey(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function solicitarPin() {
            let pin = prompt("INGRESE CONTRASEÑA DE MODO SUPERVISOR:");
            if (pin === "1234") {
                isUnlocked = true;
                document.getElementById('dateNavigator').classList.add('unlocked');
                alert("¡BIENVENIDO!");
                renderApp();
            } else if (pin !== null) {
                alert("Contraseña incorrecta.");
            }
        }

        function changeWeek(weeks) {
            baseDate.setDate(baseDate.getDate() + (weeks * 7));
            renderApp();
        }

        function switchTab(tab) {
            if (tab === 'turnos') {
                document.getElementById('viewTurnos').style.display = 'block';
                document.getElementById('viewExcel').style.display = 'none';
                document.getElementById('btnTurnos').classList.add('active');
                document.getElementById('btnExcel').classList.remove('active');
            } else {
                document.getElementById('viewTurnos').style.display = 'none';
                document.getElementById('viewExcel').style.display = 'block';
                document.getElementById('btnExcel').classList.add('active');
                document.getElementById('btnTurnos').classList.remove('active');
                renderExcelTable();
            }
        }

        // Determina si hay guardia (G) en los días cercanos para expandir fin de semana/feriados
        function getSmartDaysArray(targetDate) {
            let dKey = formatDateKey(targetDate);
            let dayOfWeek = targetDate.getDay(); // 0: Dom, 6: Sáb, 5: Vie, 1: Lun, 2: Mar

            // Si está desbloqueado el modo auditoría semanal, devuelve toda la semana completa
            if (isUnlocked) {
                let d = new Date(targetDate);
                let day = d.getDay();
                let diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
                let monday = new Date(d.setDate(diffToMonday));
                let weekArr = [];
                for (let i = 0; i < 7; i++) {
                    let nextDay = new Date(monday);
                    nextDay.setDate(monday.getDate() + i);
                    weekArr.push(formatDateKey(nextDay));
                }
                return weekArr;
            }

            // --- LÓGICA INTELIGENTE DE FIN DE SEMANA Y FERIADOS CON GUARDIA (G) ---
            // Verificamos si algún supervisor tiene "G" (Guardia) cerca (Viernes a Lunes/Martes)
            let hasGuardDutyNearby = false;
            let checkRangeDays = [];
            
            // Construimos un rango de análisis amplio alrededor del día actual
            let startScan = new Date(targetDate);
            startScan.setDate(startScan.getDate() - 2);
            for(let i=0; i<6; i++) {
                let scanDate = new Date(startScan);
                scanDate.setDate(startScan.getDate() + i);
                let sKey = formatDateKey(scanDate);
                if(rawSchedule[sKey]) {
                    Object.values(rawSchedule[sKey]).forEach(val => {
                        if(val === "G") hasGuardDutyNearby = true;
                    });
                }
            }

            // Si es fin de semana (Sábado o Domingo) o hay una Guardia (G) próxima integrada al esquema
            if (dayOfWeek === 0 || dayOfWeek === 6 || hasGuardDutyNearby) {
                // Buscamos el lunes anterior o el viernes para armar el bloque de finde / feriado extendido
                let d = new Date(targetDate);
                let day = d.getDay();
                // Encontrar el inicio del bloque (ej. Viernes si cae finde/guardia)
                let diffToFriday = d.getDate() - day - (day === 0 ? 2 : 1); 
                // Para simplificar y robustecer: si cae cerca de finde o guardia, mostramos un bloque dinámico de 3 o 4 días relevantes
                let activeDays = [];
                
                // Recorremos desde 1 día antes hasta 2 días después para capturar feriados / guardias pegadas
                let baseBlock = new Date(targetDate);
                baseBlock.setDate(baseBlock.getDate() - 1);
                
                for(let i=0; i<4; i++) {
                    let currentD = new Date(baseBlock);
                    currentD.setDate(baseBlock.getDate() + i);
                    let cKey = formatDateKey(currentD);
                    // Solo incluir si existe en la planilla
                    let dayHasData = rawSchedule[cKey] && Object.keys(rawSchedule[cKey]).length > 0;
                    if(dayHasData || i < 3) {
                        activeDays.push(cKey);
                    }
                }
                if(activeDays.length >= 2) return activeDays;
            }

            // Por defecto, muestra únicamente el día actual seleccionado
            return [dKey];
        }

        function renderApp() {
            let daysArr = getSmartDaysArray(baseDate);

            if (isUnlocked) {
                document.getElementById('lblRangoFechas').innerText = `MODO AUDITORÍA SEMANAL`;
                document.getElementById('lblSubSemana').innerText = `Semana activa`;
                document.getElementById('dateNavigator').classList.add('unlocked');
            } else {
                document.getElementById('lblRangoFechas').innerText = baseDate.toLocaleDateString('es', {weekday: 'long', day: 'numeric', month: 'short'});
                document.getElementById('lblSubSemana').innerText = daysArr.length > 1 ? `Bloque operativo / Guardia` : `Turno actual`;
                document.getElementById('dateNavigator').classList.remove('unlocked');
            }

            let colWidths = `125px ` + `repeat(${daysArr.length}, 1fr)`;
            document.getElementById('headerGridDays').style.gridTemplateColumns = colWidths;

            let headerHtml = `<div class="col-sup">SUP</div>`;
            daysArr.forEach((dateStr) => {
                let foundObj = availableDates.find(d => d.dateStr === dateStr);
                let label = foundObj ? foundObj.label : dateStr.split('-').reverse().slice(0,2).join('/');
                headerHtml += `<div><span style="font-size:11px; font-weight:bold">${label}</span></div>`;
            });
            document.getElementById('headerGridDays').innerHTML = headerHtml;

            let rowsHtml = '';
            supervisorsList.forEach(sup => {
                rowsHtml += `
                    <div class="supervisor-row" style="grid-template-columns: ${colWidths};">
                        <div class="sup-info">
                            <div class="sup-name">${sup.name}</div>
                            <div class="sup-area">${sup.area}</div>
                            <div class="sup-contact-icons">
                                <a href="https://wa.me/${sup.phone}" target="_blank" class="contact-btn" title="Enviar WhatsApp">
                                    <svg viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.84 9.84 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.41 0 0 5.41 0 12.053c0 2.11.553 4.162 1.604 5.971L0 24l6.143-1.605a11.83 11.83 0 005.905 1.585h.005c6.64 0 12.05-5.41 12.05-12.05a11.9 11.9 0 00-3.488-8.413z"/></svg>
                                </a>
                                <a href="mailto:${sup.email}" class="contact-btn" title="Enviar Correo Outlook">
                                    <svg viewBox="0 0 24 24"><path fill="#0078D4" d="M12.5 2.5l9 5.2v10.6l-9 5.2-9-5.2V7.7l9-5.2z"/><path fill="#198AB3" d="M12.5 2.5v21l9-5.2V7.7l-9-5.2z"/><path fill="#005A9E" d="M12.5 13.5L3.5 8.3l9-5.2 9 5.2-9 5.2z"/><path fill="#002050" d="M3.5 8.3v9.5l9 5.2v-11.1l-9-3.6z"/><circle cx="8" cy="15" r="4.5" fill="#0078D4"/><text x="8" y="17.2" font-size="6.5" font-weight="bold" fill="#ffffff" text-anchor="middle">O</text></svg>
                                </a>
                            </div>
                        </div>
                `;

                daysArr.forEach(dateStr => {
                    let dayData = rawSchedule[dateStr] || {};
                    let val = dayData[sup.key] || "";

                    let badgeClass = "badge-empty";
                    let displayText = "-";

                    if (val === "AM") {
                        badgeClass = "badge-am";
                        displayText = "AM";
                    } else if (val === "PM") {
                        badgeClass = "badge-pm";
                        displayText = "PM";
                    } else if (val === "G") {
                        badgeClass = "badge-guardia";
                        displayText = "AM/PM"; // Guardia transformada a AM/PM
                    } else if (val === "FC") {
                        badgeClass = "badge-franco";
                        displayText = "FC";
                    } else if (val === "VAC") {
                        badgeClass = "badge-franco";
                        displayText = "VAC";
                    }

                    rowsHtml += `<div class="shift-cell ${badgeClass}">${displayText}</div>`;
                });

                rowsHtml += `</div>`;
            });

            document.getElementById('rowsSupervisorsContainer').innerHTML = rowsHtml;
        }

        function renderExcelTable() {
            const table = document.getElementById('excelTable');
            if (availableDates.length === 0) {
                table.innerHTML = "<tr><td>Cargando datos...</td></tr>";
                return;
            }

            let html = `<thead><tr><th>Supervisor</th>`;
            availableDates.forEach(item => {
                html += `<th>${item.label}</th>`;
            });
            html += `</tr></thead><tbody>`;

            supervisorsList.forEach(sup => {
                html += `<tr><td style="font-weight:bold">${sup.name}</td>`;
                availableDates.forEach(item => {
                    let val = rawSchedule[item.dateStr] && rawSchedule[item.dateStr][sup.key] ? rawSchedule[item.dateStr][sup.key] : "";
                    let bg = "";
                    let dispVal = val;
                    if(val === "AM") bg = "color:#38bdf8";
                    else if(val === "PM") bg = "color:#fbbf24";
                    else if(val === "G") { bg = "color:#f87171; font-weight:bold"; dispVal = "AM/PM"; }
                    html += `<td style="${bg}">${dispVal}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody>`;
            table.innerHTML = html;
        }

        loadSheetData();
    </script>
</body>
</html>
